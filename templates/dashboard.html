<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script>
    async function refresh() {
        const res = await fetch('/api/visits');
        const visits = await res.json();
        const table = document.getElementById('visits');
        table.innerHTML = '';

        visits.forEach(v => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${v.timestamp}</td>
                <td>${v.ip}</td>
                <td>${v.city || '-'}</td>
                <td>${v.region || '-'}</td>
                <td>${v.country || '-'}</td>
                <td>${v.language}</td>
                <td>${v.platform}</td>
                <td>${v.user_agent}</td>
                <td>${v.screen}</td>
                <td>${v.timezone}</td>
                <td>${v.referer}</td>
            `;
            table.appendChild(row);
        });
    }
    setInterval(refresh, 2000);
    window.onload = refresh;
    </script>
</head>
<body>
    <h1>Dernières visites</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Horodatage</th>
                <th>IP</th>
                <th>Ville</th>
                <th>Région</th>
                <th>Pays</th>
                <th>Langue</th>
                <th>Plateforme</th>
                <th>User-Agent</th>
                <th>Écran</th>
                <th>Fuseau</th>
                <th>Referer</th>
            </tr>
        </thead>
        <tbody id="visits"></tbody>
    </table>
</body>
</html>
